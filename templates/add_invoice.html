{% extends "base.html" %}

{% block content %}
<br><br>
<div class="row">
    <div class="col-12">
        <div class="card shadow-lg border-0 mb-5" style="background-color: #272E48; color: #bcd0f7;">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                <h4 class="mb-0 font-weight-bold">Enregistrer une Nouvelle Facture</h4>
                <a href="{% url 'home' %}" class="btn btn-outline-light btn-sm">&larr; Retour à l'accueil</a>
            </div>
            <div class="card-body p-4">
                <form action="{% url 'add-invoice' %}" method="post" id="invoice-form">
                    {% csrf_token %}
                    
                    <div class="form-row mb-3">
                        <div class="form-group col-md-6">
                            <label for="customer" class="font-weight-bold">Client <span class="text-danger">*</span></label>
                            <select name="customer" class="form-control" id="customer" required>
                                <option value="">Choisir un client...</option>
                                {% for customer in customers %}
                                <option value="{{ customer.id }}">{{ customer.name }} ({{ customer.city|default:"-" }})</option>
                                {% endfor %}
                            </select>
                            {% if not customers %}
                            <small class="text-warning">Aucun client trouvé. <a href="{% url 'add-customer' %}" class="text-info font-weight-bold">Ajouter un client d'abord</a>.</small>
                            {% endif %}
                        </div>

                        <div class="form-group col-md-6">
                            <label for="invoice_type" class="font-weight-bold">Type de Document <span class="text-danger">*</span></label>
                            <select name="invoice_type" class="form-control" id="invoice_type" required>
                                <option value="">Choisir le type...</option>
                                <option value="R">REÇU</option>
                                <option value="P">FACTURE PROFORMA</option>
                                <option value="I">FACTURE DÉFINITIVE</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4 mb-2 pb-2 border-bottom border-secondary">
                        <h5 class="text-white font-weight-bold mb-0">Articles &amp; Produits</h5>
                        <div>
                            <button type="button" id="btn-add" class="btn btn-sm btn-info mr-2">
                                + Ajouter une ligne
                            </button>
                            <button type="button" id="btn-remove" class="btn btn-sm btn-outline-warning">
                                - Supprimer la dernière
                            </button>
                        </div>
                    </div>

                    <div id="wrapper">
                        <div class="form-row align-items-end mb-2 item-row">
                            <div class="form-group col-md-4 mb-2">
                                <label for="article-1">Désignation de l'article</label>
                                <input required name="article" type="text" class="form-control" id="article-1" placeholder="Ex: Ordinateur portable">
                            </div>

                            <div class="form-group col-md-2 mb-2">
                                <label for="qty-1">Quantité</label>
                                <input required name="qty" type="number" min="1" step="1" value="1" class="form-control text-center" id="qty-1">
                            </div>

                            <div class="form-group col-md-3 mb-2">
                                <label for="unit-1">Prix Unitaire (FCFA)</label>
                                <input required name="unit" type="number" min="0" step="0.01" placeholder="0.00" class="form-control text-right" id="unit-1">
                            </div>

                            <div class="form-group col-md-3 mb-2">
                                <label for="total-a-1">Sous-total (FCFA)</label>
                                <input name="total-a" type="number" step="0.01" readonly class="form-control text-right bg-secondary text-white font-weight-bold" id="total-a-1" value="0.00">
                            </div>
                        </div>
                    </div>

                    <hr class="border-secondary my-4">

                    <div class="form-row align-items-center mb-3">
                        <div class="form-group col-md-7">
                            <label for="comment" class="font-weight-bold">Commentaires ou notes</label>
                            <textarea class="form-control" name="comment" id="comment" rows="2" placeholder="Informations complémentaires, modalités de paiement..."></textarea>
                        </div>

                        <div class="form-group col-md-5">
                            <div class="p-3 rounded text-right" style="background-color: #1a233a;">
                                <label for="total" class="font-weight-bold text-uppercase text-muted d-block mb-1">Total Général (FCFA)</label>
                                <input value="0.00" type="number" step="0.01" name="total" readonly class="form-control text-right font-weight-bold text-success border-0" id="total" style="font-size: 1.5rem; background: transparent;">
                            </div>
                        </div>
                    </div>

                    <div class="text-right mt-4 pt-3 border-top border-secondary">
                        <a href="{% url 'home' %}" class="btn btn-outline-light px-4 mr-2">Annuler</a>
                        <button type="submit" name="action" value="save" class="btn btn-primary px-4 mr-2 font-weight-bold">
                            Enregistrer
                        </button>
                        <button type="submit" name="action" value="save_and_download" class="btn btn-success px-4 font-weight-bold shadow">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-earmark-pdf mr-1" viewBox="0 0 16 16">
                              <path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5v2z"/>
                              <path d="M4.603 14.087a.81.81 0 0 1-.438-.42c-.195-.388-.13-.776.08-1.102.198-.307.526-.568.897-.787a7.68 7.68 0 0 1 1.482-.645 19.697 19.697 0 0 0 1.062-2.227 7.269 7.269 0 0 1-.43-1.295c-.086-.4-.119-.796-.046-1.136.075-.354.274-.672.65-.823.192-.077.4-.12.602-.077a.7.7 0 0 1 .477.422c.166.34.199.74.094 1.15-.095.37-.308.79-.604 1.246.36.832.81 1.637 1.34 2.398a9.12 9.12 0 0 1 2.1-.37c.483-.03.886.08 1.14.3.188.16.294.38.29.623a.87.87 0 0 1-.296.614c-.26.23-.67.312-1.15.22-.66-.124-1.42-.48-2.22-.988a10.994 10.994 0 0 1-2.43 1.268c-.65.253-1.28.435-1.85.538-.28.05-.53.06-.74.028z"/>
                            </svg>
                            Enregistrer &amp; Télécharger PDF
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $(document).ready(function () {
        
        // Ajouter une nouvelle ligne d'article
        $('#btn-add').on('click', function () {
            var number = $('#wrapper .item-row').length + 1;
            let formAdd = `
            <div class="form-row align-items-end mb-2 item-row">
                <div class="form-group col-md-4 mb-2">
                    <label for="article-${number}">Désignation de l'article #${number}</label>
                    <input required name="article" type="text" class="form-control" id="article-${number}" placeholder="Désignation article">
                </div>
                <div class="form-group col-md-2 mb-2">
                    <label for="qty-${number}">Quantité</label>
                    <input required name="qty" type="number" min="1" step="1" value="1" class="form-control text-center" id="qty-${number}">
                </div>
                <div class="form-group col-md-3 mb-2">
                    <label for="unit-${number}">Prix Unitaire (FCFA)</label>
                    <input required name="unit" type="number" min="0" step="0.01" placeholder="0.00" class="form-control text-right" id="unit-${number}">
                </div>
                <div class="form-group col-md-3 mb-2">
                    <label for="total-a-${number}">Sous-total (FCFA)</label>
                    <input name="total-a" type="number" step="0.01" readonly class="form-control text-right bg-secondary text-white font-weight-bold" id="total-a-${number}" value="0.00">
                </div>
            </div>`;
            $("#wrapper").append(formAdd);
        });

        // Supprimer la dernière ligne (garder au moins 1)
        $('#btn-remove').on('click', function () {
            if ($("#wrapper .item-row").length > 1) {
                $("#wrapper .item-row").last().remove();
                recalculerTotalCumule();
            }
        });

        // Recalcule le sous-total d'une ligne
        function recalculerLigne(element) {
            let row = $(element).closest('.item-row');
            let qty = parseFloat(row.find('input[name="qty"]').val()) || 0;
            let unit = parseFloat(row.find('input[name="unit"]').val()) || 0;
            let totalLigne = qty * unit;
            row.find('input[name="total-a"]').val(totalLigne.toFixed(2));
            recalculerTotalCumule();
        }

        // Recalcule le total cumulé
        function recalculerTotalCumule() {
            let total = 0;
            $('#wrapper input[name="total-a"]').each(function () {
                total += parseFloat($(this).val()) || 0;
            });
            $('#total').val(total.toFixed(2));
        }

        // Écouter les changements sur qty et unit
        $(document).on('input change', 'input[name="qty"], input[name="unit"]', function () {
            recalculerLigne(this);
        });
    });
</script>
{% endblock content %}
